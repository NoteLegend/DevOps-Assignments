apiVersion: v1
kind: Pod
metadata:
  name: container-creating
spec:
  containers:
  - name: app
    image: busybox:1.36
    command:
    - sh
    - -c
    - sleep 3600
    volumeMounts:
    - name: missing
      mountPath: /secret
  volumes:
  - name: missing
    secret:
      secretName: missing-runtime-secret
