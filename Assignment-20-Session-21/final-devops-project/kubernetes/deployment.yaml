apiVersion: apps/v1
kind: Deployment
metadata:
  name: final-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: final-app
  template:
    metadata:
      labels:
        app: final-app
    spec:
      securityContext:
        fsGroup: 10001
      initContainers:
      - name: storage-permissions
        image: busybox:1.36
        command:
        - sh
        - -c
        - chown 10001:10001 /data
        volumeMounts:
        - name: data
          mountPath: /data
      containers:
      - name: app
        image: devops-a20-final:local
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        env:
        - name: VERSION
          value: v1
        - name: APP_MESSAGE
          valueFrom:
            configMapKeyRef:
              name: final-config
              key: APP_MESSAGE
        - name: APP_SECRET
          valueFrom:
            secretKeyRef:
              name: final-secret
              key: value
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
        startupProbe:
          httpGet:
            path: /health
            port: 8080
          failureThreshold: 30
          periodSeconds: 2
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          periodSeconds: 3
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          periodSeconds: 5
        volumeMounts:
        - name: data
          mountPath: /data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: final-data
