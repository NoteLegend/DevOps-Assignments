# Prepared for the combined assignment repository; execution is owner-controlled.
name: Final DevOps pipeline
on:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    working-directory: Assignment-20-Session-21/final-devops-project
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt pytest bandit pip-audit
      - run: python -m compileall -q application
      - run: python -m pytest -v
      - run: bandit -r application -c security/bandit.yaml
      - run: pip-audit -r requirements.txt
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: docker build -t app:scan -f docker/Dockerfile .
      - uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: app:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: 'false'
          exit-code: '1'
      - name: Save the scanned image
        run: docker save app:scan -o verified-image.tar
      - uses: actions/upload-artifact@v4
        with:
          name: verified-image
          path: Assignment-20-Session-21/final-devops-project/verified-image.tar
          retention-days: 1
  publish-deploy:
    needs: verify
    environment: owner-approved-deployment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate registry
        env:
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
        run: printf '%s' "$REGISTRY_PASSWORD" | docker login -u "$REGISTRY_USERNAME" --password-stdin
      - uses: actions/download-artifact@v4
        with:
          name: verified-image
          path: Assignment-20-Session-21/final-devops-project
      - name: Load and tag the scanned image
        run: |
          docker load -i verified-image.tar
          docker tag app:scan "${{ secrets.REGISTRY_USERNAME }}/final-devops:${{ github.sha }}"
      - run: docker push "${{ secrets.REGISTRY_USERNAME }}/final-devops:${{ github.sha }}"
      - name: Deploy to approved Kubernetes target
        env:
          DEPLOY_NAMESPACE: ${{ vars.DEPLOY_NAMESPACE || 'assignment-20' }}
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG_DATA }}
          APP_SECRET: ${{ secrets.APP_SECRET }}
          IMAGE: ${{ secrets.REGISTRY_USERNAME }}/final-devops:${{ github.sha }}
        run: |
          printf '%s' "$KUBECONFIG_DATA" | base64 --decode > "$RUNNER_TEMP/kubeconfig"
          export KUBECONFIG="$RUNNER_TEMP/kubeconfig"
          chmod 600 "$KUBECONFIG"
          kubectl create namespace "$DEPLOY_NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n "$DEPLOY_NAMESPACE" create secret generic final-secret --from-literal=value="$APP_SECRET" --dry-run=client -o yaml | kubectl -n "$DEPLOY_NAMESPACE" apply -f -
          kubectl -n "$DEPLOY_NAMESPACE" apply -f kubernetes/
          kubectl -n "$DEPLOY_NAMESPACE" set image deployment/final-app app="$IMAGE"
          kubectl -n "$DEPLOY_NAMESPACE" rollout status deployment/final-app --timeout=180s
