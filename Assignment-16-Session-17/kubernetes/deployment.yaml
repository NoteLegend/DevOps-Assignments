apiVersion: apps/v1
kind: Deployment
metadata:
  name: devsecops
spec:
  replicas: 2
  selector:
    matchLabels: {app: devsecops}
  template:
    metadata:
      labels: {app: devsecops}
    spec:
      containers:
        - name: app
          image: devops-a16-app:local
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 5000}]
          readinessProbe:
            httpGet: {path: /health, port: 5000}
          livenessProbe:
            httpGet: {path: /health, port: 5000}
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
