name: DevSecOps pipeline
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build-scan-publish-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      KIND_CLUSTER: assignment16-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare tools and evidence
        run: |
          mkdir -p "$RUNNER_TEMP/a16-evidence"
          pip install -r requirements.txt pytest bandit==1.9.4 pip-audit==2.10.1
      - name: Application build
        run: python -m compileall -q application
      - name: Unit tests
        run: python -m pytest -v --junitxml="$RUNNER_TEMP/a16-evidence/tests.xml"
      - name: SAST gate
        run: bandit -r application -c security/bandit.yaml -f json -o "$RUNNER_TEMP/a16-evidence/bandit.json"
      - name: SCA gate
        run: pip-audit -r requirements.txt -f json -o "$RUNNER_TEMP/a16-evidence/pip-audit.json"
      - name: Secret scanning gate
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz"
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt -o "$RUNNER_TEMP/gitleaks_checksums.txt"
          (cd "$RUNNER_TEMP" && sha256sum --check --ignore-missing gitleaks_checksums.txt)
          tar -xzf "$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" dir . --config .gitleaks.toml --redact --report-format json --report-path "$RUNNER_TEMP/a16-evidence/gitleaks.json"
      - name: Docker image build
        env:
          SOURCE_REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          image="ghcr.io/${SOURCE_REPOSITORY,,}-devsecops:$REVISION"
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          docker build --label "org.opencontainers.image.source=https://github.com/$SOURCE_REPOSITORY" --label "org.opencontainers.image.revision=$REVISION" -t "$image" .
          docker image inspect "$image" --format '{{.Id}}' > "$RUNNER_TEMP/a16-evidence/built-image-id.txt"
      - name: Container image scan and HIGH/CRITICAL security gate
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ env.IMAGE }}
          version: v0.76.0
          severity: HIGH,CRITICAL
          ignore-unfixed: 'false'
          exit-code: '1'
          format: json
          output: ${{ runner.temp }}/a16-evidence/trivy.json
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the same scanned image
        run: |
          docker image inspect "$IMAGE" --format '{{.Id}}' > "$RUNNER_TEMP/a16-evidence/published-image-id.txt"
          cmp "$RUNNER_TEMP/a16-evidence/built-image-id.txt" "$RUNNER_TEMP/a16-evidence/published-image-id.txt"
          docker push "$IMAGE" | tee "$RUNNER_TEMP/a16-evidence/registry-push.txt"
      - name: Create an isolated runner-local Kubernetes cluster
        run: |
          curl -fsSL https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64 -o "$RUNNER_TEMP/kind"
          echo 'aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d  '"$RUNNER_TEMP/kind" | sha256sum --check
          chmod +x "$RUNNER_TEMP/kind"
          "$RUNNER_TEMP/kind" create cluster --name "$KIND_CLUSTER" --image kindest/node:v1.35.8@sha256:07b2536e30b803ed61d1677a79df6115f798ce64c80f9e22f6ed45afd09323c0 --wait 180s
          "$RUNNER_TEMP/kind" load docker-image "$IMAGE" --name "$KIND_CLUSTER"
      - name: Deploy and verify the published image in Kubernetes
        run: |
          context="kind-$KIND_CLUSTER"
          kubectl --context "$context" create namespace assignment-16
          kubectl set image -f kubernetes/deployment.yaml app="$IMAGE" --local -o yaml > "$RUNNER_TEMP/a16-deployment.yaml"
          kubectl --context "$context" -n assignment-16 apply -f "$RUNNER_TEMP/a16-deployment.yaml"
          kubectl --context "$context" -n assignment-16 rollout status deployment/devsecops --timeout=180s
          kubectl --context "$context" -n assignment-16 get pods,deployments,services -o wide | tee "$RUNNER_TEMP/a16-evidence/kubernetes-resources.txt"
          kubectl --context "$context" -n assignment-16 port-forward svc/devsecops 8160:80 > "$RUNNER_TEMP/a16-evidence/port-forward.txt" 2>&1 &
          forward_pid=$!
          trap 'kill "$forward_pid" 2>/dev/null || true' EXIT
          curl --retry 20 --retry-connrefused --retry-delay 2 --fail http://127.0.0.1:8160/health | tee "$RUNNER_TEMP/a16-evidence/health.json"
          python -c 'import json, pathlib; assert json.loads(pathlib.Path("'"$RUNNER_TEMP"'/a16-evidence/health.json").read_text())["status"] == "healthy"'
          kubectl --context "$context" -n assignment-16 logs deployment/devsecops > "$RUNNER_TEMP/a16-evidence/application.log"
      - name: Remove the assignment-owned cluster
        if: always()
        run: |
          if test -x "$RUNNER_TEMP/kind"; then "$RUNNER_TEMP/kind" delete cluster --name "$KIND_CLUSTER"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: devsecops-execution-evidence
          path: ${{ runner.temp }}/a16-evidence/
          retention-days: 1
