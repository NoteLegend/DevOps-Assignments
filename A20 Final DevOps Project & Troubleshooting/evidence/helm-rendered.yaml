---
# Source: final-app/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: final-config
data:
  APP_MESSAGE: "Final DevOps Helm application"

---
# Source: final-app/templates/pvc.yaml
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: final-data
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: standard
  resources:
    requests:
      storage: 500Mi

---
# Source: final-app/templates/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: final-app
spec:
  selector:
    app: final-app
  ports:
  - port: 80
    targetPort: 8080

---
# Source: final-app/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: final-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: final-app
  template:
    metadata:
      labels:
        app: final-app
    spec:
      securityContext:
        fsGroup: 10001
      initContainers:
      - name: storage-permissions
        image: busybox:1.36
        command:
        - sh
        - -c
        - chown 10001:10001 /data
        volumeMounts:
        - name: data
          mountPath: /data
      containers:
      - name: app
        image: "devops-a20-final:local"
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        env:
        - name: VERSION
          value: "v1"
        - name: APP_MESSAGE
          valueFrom:
            configMapKeyRef:
              name: final-config
              key: APP_MESSAGE
        - name: APP_SECRET
          valueFrom:
            secretKeyRef:
              name: final-secret
              key: value
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
        startupProbe:
          httpGet:
            path: /health
            port: 8080
          failureThreshold: 30
          periodSeconds: 2
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          periodSeconds: 3
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          periodSeconds: 5
        volumeMounts:
        - name: data
          mountPath: /data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: final-data

---
# Source: final-app/templates/hpa.yaml
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: final-app
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: final-app
  minReplicas: 2
  maxReplicas: 4
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50

---
# Source: final-app/templates/ingress.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: final-app
spec:
  ingressClassName: nginx
  rules:
  - host: "final-helm.local"
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: final-app
            port:
              number: 80
