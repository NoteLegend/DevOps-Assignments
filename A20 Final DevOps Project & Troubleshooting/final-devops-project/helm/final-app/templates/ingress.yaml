apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: final-app
spec:
  ingressClassName: nginx
  rules:
  - host: {{ .Values.host | quote }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: final-app
            port:
              number: 80
