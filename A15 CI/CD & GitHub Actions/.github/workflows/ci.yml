name: Calculator CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: pytest -v
  security-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          if find . -type f \( -name '.env' -o -name '*.pem' -o -name '*.key' \) | grep .; then exit 1; fi
  build:
    needs: [test, security-check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash build.sh
      - run: docker build -t calculator:ci .
      - uses: actions/upload-artifact@v4
        with:
          name: calculator-build
          path: build/
