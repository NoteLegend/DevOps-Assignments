name: Calculator CD
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  delivery:
    environment: owner-approved-delivery
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t "${{ secrets.REGISTRY_USERNAME }}/calculator:${{ github.sha }}" .
      - name: Registry authentication
        env:
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
        run: printf '%s' "$REGISTRY_PASSWORD" | docker login -u "$REGISTRY_USERNAME" --password-stdin
      - run: docker push "${{ secrets.REGISTRY_USERNAME }}/calculator:${{ github.sha }}"
