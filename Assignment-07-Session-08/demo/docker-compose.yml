services:
  frontend:
    image: nginx:latest
    ports:
    - 8081:80
    volumes:
    - ./frontend/index.html:/usr/share/nginx/html/index.html
    - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
    - frontend_net
    depends_on:
      backend:
        condition: service_healthy
  backend:
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Use the runtime env file}
    build: ./backend
    networks:
    - frontend_net
    - backend_net
    depends_on:
    - database
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen("http://127.0.0.1:5000/")
      interval: 2s
      timeout: 2s
      retries: 30
  database:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Use the runtime env file}
      MYSQL_DATABASE: demo
    volumes:
    - db_data:/var/lib/mysql
    networks:
    - backend_net
networks:
  frontend_net: null
  backend_net: null
volumes:
  db_data: null
