apiVersion: apps/v1
kind: Deployment
metadata:
  name: canary
spec:
  replicas: 1
  selector:
    matchLabels:
      app: canary
  template:
    metadata:
      labels:
        app: canary
        family: canary
    spec:
      containers:
      - name: web
        image: busybox:1.36
        command:
        - sh
        - -c
        - mkdir -p /tmp/www; echo "$VERSION" > /tmp/www/index.html; exec httpd -f
          -p 8080 -h /tmp/www
        env:
        - name: VERSION
          value: canary
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 4
          periodSeconds: 2
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 64Mi
